services:
  livekit:
    ports: !override
      - target: ${FLUXER_LIVEKIT_TCP_PORT:-7881}
        published: "${FLUXER_LIVEKIT_TCP_PORT:-7881}"
        host_ip: ${FLUXER_VPN_IP:?Set the NAS VPN address}
        protocol: tcp
      - target: ${FLUXER_LIVEKIT_UDP_PORT:-7882}
        published: "${FLUXER_LIVEKIT_UDP_PORT:-7882}"
        host_ip: ${FLUXER_VPN_IP:?Set the NAS VPN address}
        protocol: udp
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${FLUXER_LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: ${FLUXER_LIVEKIT_TCP_PORT:-7881}
          udp_port: ${FLUXER_LIVEKIT_UDP_PORT:-7882}
          use_external_ip: false
          node_ip: "${FLUXER_VPN_IP:?Set the NAS VPN address}"
          stun_servers:
            - ${FLUXER_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
            - ${FLUXER_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
          turn_servers: ${FLUXER_LIVEKIT_TURN_SERVERS:-[]}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-}
          urls:
            - http://api:8080/webhooks/livekit
